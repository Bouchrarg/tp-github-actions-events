name: Push filtré (branches et paths)
 
on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'docs/**'
      - '**.md'
 
jobs:
  afficher:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher un message
        run: echo "Push sur une branche autorisée avec un fichier docs ou .md modifié"
